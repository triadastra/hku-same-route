name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r hku-agents/requirements.txt
      # Free and offline: the data, the people, the published walks, the Claude loop and a 300-person run.
      - run: python hku-agents/pipeline.py check
